# =====================================================================
#  DistriLab deployment configuration
#  ---------------------------------------------------------------------
#  Loaded automatically when you run from the project folder (the
#  scripts do this). Anything here overrides the built-in defaults, and
#  anything given on the command line (--key=value) overrides this file.
#  Remove the leading '#' from a line to change that setting.
# =====================================================================

# ---- Where is the bootstrap node? -----------------------------------
# Single computer: leave as 127.0.0.1.
# Several computers: set to the LAN IP of the machine running the
# bootstrap node, e.g. 192.168.1.20, on EVERY machine.
bootstrap.host=127.0.0.1
bootstrap.port=1099

# ---- How do other machines reach THIS machine? ----------------------
# Single computer: 127.0.0.1. Several computers: this machine's LAN IP.
# (Can also be given per process: --host=192.168.1.21)
rmi.hostname=127.0.0.1

# ---- Workers ------------------------------------------------------------
# Threads each worker uses to run sub-tasks concurrently.
worker.threads=4
# How often workers ping neighbours / the coordinator (ms).
worker.heartbeatIntervalMs=2000

# ---- Overlay ------------------------------------------------------------
# 1 = each new worker links to exactly one random active worker.
# 2 = one random worker + one extra random link (gives the network cycles).
overlay.linksPerJoin=2

# ---- Coordinator terms --------------------------------------------------
# A coordinator serves one term of at most this many jobs.
coordinator.maxJobsPerTerm=5
# Should the coordinator also compute a share of each job?
coordinator.includeSelf=true

# ---- Job limits ---------------------------------------------------------
#jobs.maxListSize=5000000
#jobs.maxPrimeSumRange=1000000000
#jobs.maxPrimeSumEnd=1000000000000

# ---- Client -------------------------------------------------------------
#client.threads=8
#client.retryDelayMs=500

# ---- Logging ------------------------------------------------------------
#log.debug=false
