# =====================================================================
#  DistriLab built-in defaults (packaged inside distrilab.jar).
#  Do not edit this file to configure a deployment - edit
#  config/distrilab.properties or pass --key=value on the command line.
#  Every key that can be overridden MUST exist here, which also lets the
#  launcher reject misspelt options.
# =====================================================================

# ---- Bootstrap node --------------------------------------------------
bootstrap.host=127.0.0.1
bootstrap.port=1099
bootstrap.serviceName=DistriLabBootstrap
# A worker that has not renewed its lease for this long is removed.
bootstrap.leaseTimeoutMs=10000
bootstrap.sweepIntervalMs=2000

# ---- Java RMI ---------------------------------------------------------
# Address that OTHER machines should use to reach THIS process
# (sets java.rmi.server.hostname). Use your LAN IP for multi-machine runs.
rmi.hostname=127.0.0.1
rmi.connectTimeoutMs=3000
rmi.responseTimeoutMs=300000

# ---- Worker ------------------------------------------------------------
# 0 = let the bootstrap node assign the next free ID.
worker.id=0
# 0 = any free port.
worker.port=0
worker.threads=4
worker.heartbeatIntervalMs=2000
worker.leaseRenewIntervalMs=3000
worker.joinRetries=15
worker.joinRetryDelayMs=1000
worker.console=true

# ---- Overlay (unstructured network) -----------------------------------
# Links made when a worker joins. The first is the random active worker
# chosen by the bootstrap node; extra links add cycles/redundancy.
overlay.linksPerJoin=2

# ---- Leader election ---------------------------------------------------
election.timeoutMs=10000
election.hopMarginMs=250
election.jitterMaxMs=600
election.staleChecks=3
election.seenTtlMs=600000

# ---- Coordinator / job processing -------------------------------------
coordinator.maxJobsPerTerm=5
coordinator.includeSelf=true
coordinator.maxTaskAttempts=3

# ---- Job limits (protect the cluster from absurd inputs) --------------
jobs.maxListSize=5000000
jobs.maxPrimeSumRange=1000000000
jobs.maxPrimeSumEnd=1000000000000

# ---- Client --------------------------------------------------------------
client.threads=8
client.maxSubmitAttempts=40
client.retryDelayMs=500
client.statusRefreshMs=3000
client.randomMax=1000000
client.textAreaLimit=5000

# ---- Logging ---------------------------------------------------------------
log.debug=false
